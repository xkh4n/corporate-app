name: ${PROJECT_NAME}${SUFFIX}

secrets:
    pg_replication_password:
        file: ../corporate-secrets/Development/pg_replication_password.txt
    pg_admin_password:
        file: ../corporate-secrets/Development/pg_admin_password.txt
    pg_user_password:
        file: ../corporate-secrets/Development/pg_user_password.txt
    pg_logger_password:
        file: ../corporate-secrets/Development/pg_logger_password.txt
    pg_exporter_password:
        file: ../corporate-secrets/Development/pg_exporter_password.txt
    pg_password:
        file: ../corporate-secrets/Development/pg_password.txt
    db_mongo_password:
        file: ../corporate-secrets/Development/db_mongo_password.txt
    db_mongo_user_password:
        file: ../corporate-secrets/Development/db_mongo_user_password.txt
    db_gui_password:
        file: ../corporate-secrets/Development/db_gui_password.txt
    db_mongo_logs:
        file: ../corporate-secrets/Development/db_mongo_logs.txt
    mongodb_keyfile:
        file: ../corporate-secrets/Development/MongoKeyfile/mongodb_keyfile.txt
    db_mongo_exporter:
        file: ../corporate-secrets/Development/db_mongo_exporter.txt
    mssql_password:
        file: ../corporate-secrets/Development/mssql_password.txt
    mssql_exporter_password:
        file: ../corporate-secrets/Development/mssql_exporter_password.txt
    mssql_app_password:
        file: ../corporate-secrets/Development/mssql_app_password.txt
    redis_password:
        file: ../corporate-secrets/Development/redis_password.txt
    redis_exporter_password:
        file: ../corporate-secrets/Development/redis_exporter_password.txt

networks:
    backend:
        name: ${PROJECT_NAME}_backend${SUFFIX}
        # internal: true -hallazgo CRITICO de auditoria (PoC real: getent
        # hosts google.com / wget a 1.1.1.1 desde betelgeuse01dev y
        # centaury01dev resolvian/traian trafico real de internet). Ningun
        # motor de BD necesita egreso real -solo necesitan hablarse entre
        # ellos (replicacion) y con corporate-api/los exporters, todo DENTRO
        # de esta misma red-. "internal: true" NO rompe esa comunicacion
        # intra-red (Docker sigue enrutando entre contenedores de la misma
        # red bridge normalmente); solo quita la ruta default + regla de
        # MASQUERADE que le daban salida NAT hacia el host/internet.
        # Verificado tras el rebuild: los engines siguen replicando
        # (Postgres streaming, Mongo rs, MSSQL AG) y el PoC de la auditoria
        # ahora falla (timeout de DNS).
        internal: true
        # Motores de BD + sus exporters (los exporters necesitan alcanzar su
        # motor local para poder scrapearlo). corporate-monitoring (stack de
        # observabilidad, proyecto Compose separado) NO se conecta acá -ver
        # la red "exporters" de abajo, que es la que expone hacia afuera-.
    # Hallazgo de auditoría (MEDIO, defensa en profundidad -la autenticación
    # de cada motor ya bloquea el acceso real de verdad, confirmado por el
    # auditor con pruebas en vivo; esto es blindaje adicional barato, no el
    # cierre de una brecha activa-): Prometheus (corporate-monitoring, otro
    # proyecto Compose) se conecta acá para poder scrapear los 8 exporters
    # por nombre, pero esta red NO incluye a los motores de BD -solo a sus
    # exporters, dual-homed en "backend" (para llegar a su motor local) y acá
    # (para ser alcanzables desde Prometheus)-. Un Prometheus comprometido ya
    # ni siquiera tiene RUTA de red hacia postgres01dev:5432, mongo01dev:27017,
    # redis01dev:6379 o mssql01dev:1433 -antes, al compartir una sola red
    # "backend" con todo, Prometheus podía intentar conectarse directo a esos
    # puertos (bloqueado únicamente por la autenticación de cada motor, no por
    # la red)-.
    # internal: true -mismo motivo que "backend": Prometheus solo necesita
    # alcanzar estos 8 exporters por nombre desde esta red, nunca egreso real
    # a internet. Dual-homed en "backend" (también internal), asi que la
    # comunicación exporter<->motor local sigue intacta.
    exporters:
        name: ${PROJECT_NAME}_exporters${SUFFIX}
        internal: true
    # Red exclusiva de nginxdev, DELIBERADAMENTE SIN "internal: true" -unica
    # forma de que Docker publique sus 4 puertos (Postgres/Mongo/Redis/MSSQL)
    # al host en este entorno (Docker Desktop/WSL2, Windows): confirmado en
    # la practica (no asumido) que una red "internal" bloquea el port-publish
    # por completo, no solo el egreso a internet -ver el comentario en
    # "backend" mas arriba-. Ningun motor de BD ni exporter se conecta acá,
    # solo nginxdev (dual-homed con "backend"): el radio de explosión de que
    # el proxy L4 puro tenga egreso real es minimo comparado con los motores
    # de BD, que es lo que de verdad importaba aislar.
    public:
        name: ${PROJECT_NAME}_public${SUFFIX}

volumes:
    pg_primary_data:
    pg_replica_data:
    mongo_primary_data:
    mongo_secondary_data:
    mongo_arbiter_data:
    mssql_primary_data:
    mssql_secondary_data:
    redis_primary_data:
    redis_replica_data:

services:
    # *********************        Inicio Servicios de base de datos para PostgreSQL *********************
    # Primario
    postgres01dev:
        build:
            context: ./PostgreSQL
        container_name: ${POSTGRES_HOST}01${SUFFIX}
        hostname: ${POSTGRES_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): sin cap_drop/no-new-privileges, todo
        # contenedor corre con el set de capabilities completo de Docker por
        # defecto. cap_drop:[ALL] + este cap_add mínimo se probó con un
        # volumen NUEVO (no reutilizando uno ya poblado, que podría esconder
        # un CHOWN/FOWNER faltante): docker-entrypoint.sh (imagen oficial)
        # hace chown/chmod del PGDATA vacío como root en el primer arranque y
        # después baja privilegios con gosu -eso es lo que necesita CHOWN,
        # FOWNER, DAC_OVERRIDE-; gosu en sí necesita SETUID+SETGID para
        # cambiar de usuario. Confirmado con un initdb real completo y
        # "cat /proc/1/status" mostrando CapEff en 0 para el proceso postgres
        # ya corriendo (uid postgres, no root).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        # Límite de recursos: contrapresión ante un contenedor en crash-loop
        # (restart: always) para que no compita sin límite por RAM/CPU del
        # host. Dev con datos de prueba: 768M es holgado para Postgres.
        deploy:
            resources:
                limits:
                    memory: 768M
                    cpus: "1.0"
        environment:
            PG_ROLE: primary
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
            POSTGRES_DB: ${POSTGRES_DATABASE}
            PG_ADMIN: ${PG_ADMIN}${SUFFIX}
            PG_ADMIN_PASSWORD_FILE: /run/secrets/pg_admin_password
            PG_APP_USER: ${PG_APP_USER}${SUFFIX}
            PG_APP_USER_PASSWORD_FILE: /run/secrets/pg_user_password
            PG_LOGGER_USER: ${PG_LOGGER_USER}${SUFFIX}
            PG_LOGGER_USER_PASSWORD_FILE: /run/secrets/pg_logger_password
            PG_EXPORTER_USER: ${PG_EXPORTER_USER}${SUFFIX}
            PG_EXPORTER_USER_PASSWORD_FILE: /run/secrets/pg_exporter_password
            PG_REPLICATOR: ${PG_REPLICATOR}${SUFFIX}
            PG_REPLICATOR_PASSWORD_FILE: /run/secrets/pg_replication_password
        command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
        secrets:
            - pg_password
            - pg_admin_password
            - pg_user_password
            - pg_logger_password
            - pg_exporter_password
            - pg_replication_password
        volumes:
            - pg_primary_data:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    # Replica
    postgres02dev:
        build:
            context: ./PostgreSQL
        container_name: ${POSTGRES_HOST}02${SUFFIX}
        hostname: ${POSTGRES_HOST}02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio/cap set que postgres01dev (pg_basebackup en el
        # arranque en frío de la réplica también necesita chown/gosu como
        # root antes de arrancar el motor sin privilegios).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        deploy:
            resources:
                limits:
                    memory: 768M
                    cpus: "1.0"
        environment:
            PG_ROLE: replica
            PG_PRIMARY_HOST: ${POSTGRES_HOST}01${SUFFIX}
            PG_REPLICATOR: ${PG_REPLICATOR}${SUFFIX}
            PG_REPLICATOR_PASSWORD_FILE: /run/secrets/pg_replication_password
        command: ["postgres", "-c", "hot_standby=on"]
        secrets:
            - pg_replication_password
        volumes:
            - pg_replica_data:/var/lib/postgresql/data
        networks:
            - backend
        depends_on:
            postgres01dev:
                condition: service_healthy
        healthcheck:
            # Además de aceptar conexiones (pg_isready), confirma que el
            # streaming de replicación esté activo (pg_stat_wal_receiver.status
            # = 'streaming'). Conecta por el socket unix local como "postgres":
            # la imagen oficial deja "local all all trust" en pg_hba.conf por
            # defecto, así que no hace falta manejar contraseña acá.
            test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql && psql -U postgres -h /var/run/postgresql -tAc \"SELECT status FROM pg_stat_wal_receiver;\" 2>/dev/null | grep -q streaming"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    # **************************    FIN Servicios de base de datos para PostgreSQL **************************

    # *********************        Inicio Exporters de Prometheus para PostgreSQL *********************
    # Un exporter por nodo (no uno compartido): cada uno se conecta a su
    # propia instancia local, así Prometheus puede scrapear métricas de
    # ambos nodos por separado (útil para detectar, por ejemplo, que la
    # réplica está healthy pero atrasada en el WAL).
    #
    # Sin Dockerfile propio: la imagen oficial soporta nativamente
    # DATA_SOURCE_USER + DATA_SOURCE_PASS_FILE (lee el secret directo desde
    # /run/secrets/), no hace falta un wrapper para resolver el password como
    # sí hizo falta con MSSQL/Mongo/Redis. Reutiliza PG_EXPORTER_USER /
    # pg_exporter_password (rol pg_monitor, ver PostgreSQL/init/01-roles.sh) -
    # el mismo usuario que ya replica físicamente al nodo réplica.
    postgres-exporter01dev:
        image: prometheuscommunity/postgres-exporter:v0.20.1
        container_name: ${POSTGRES_HOST}-exporter01${SUFFIX}
        hostname: ${POSTGRES_HOST}-exporter01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): sin ninguna operación de arranque
        # que necesite root (la imagen oficial ya corre como "nobody" de
        # fábrica, sin wrapper propio que haga chown/gosu), cap_drop:[ALL]
        # sin ningún cap_add alcanza -confirmado arrancando el contenedor
        # así y viendo el exporter servir /metrics normalmente-.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Exporter: proceso liviano, solo ejecuta queries de solo lectura
        # contra vistas pg_stat_*/pg_settings y sirve /metrics por HTTP.
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            # Conecta a la base "postgres" de mantenimiento (no a
            # POSTGRES_DATABASE): las vistas pg_stat_*/pg_settings que usa
            # pg_monitor son de alcance de clúster, visibles desde cualquier
            # base -conectar a "postgres" evita acoplar el exporter al ciclo
            # de vida de la base de la aplicación.
            DATA_SOURCE_URI: "${POSTGRES_HOST}01${SUFFIX}:5432/postgres?sslmode=disable"
            DATA_SOURCE_USER: ${PG_EXPORTER_USER}${SUFFIX}
            DATA_SOURCE_PASS_FILE: /run/secrets/pg_exporter_password
        # Colectores extra habilitados a propósito, más allá de los que
        # vienen activados por defecto, para un monitoreo "detallado y
        # completo": wraparound de transaction ID (riesgo real en
        # producción), transacciones colgadas, checkpointer (reemplazo
        # moderno de las métricas de bgwriter en PG15+), estado del WAL
        # receiver (relevante sobre todo en el nodo réplica) y hora de
        # arranque del postmaster. NO se habilita --collector.stat_statements
        # porque requiere la extensión pg_stat_statements con
        # shared_preload_libraries -cambio que exige reiniciar el motor con
        # otro "command:" y complejiza este primer pase-; queda anotado como
        # mejora futura, no como pendiente bloqueante.
        command:
            - --collector.long_running_transactions
            - --collector.database_wraparound
            - --collector.stat_checkpointer
            - --collector.stat_wal_receiver
            - --collector.postmaster
        secrets:
            - pg_exporter_password
        # "exporters" además de "backend": ver hallazgo de auditoría junto a
        # la definición de esa red más arriba -Prometheus (otro proyecto
        # Compose) solo alcanza a este exporter, nunca al motor Postgres en
        # sí, que sigue solo en "backend"-.
        networks:
            - backend
            - exporters
        depends_on:
            postgres01dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

    postgres-exporter02dev:
        image: prometheuscommunity/postgres-exporter:v0.20.1
        container_name: ${POSTGRES_HOST}-exporter02${SUFFIX}
        hostname: ${POSTGRES_HOST}-exporter02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que postgres-exporter01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            DATA_SOURCE_URI: "${POSTGRES_HOST}02${SUFFIX}:5432/postgres?sslmode=disable"
            DATA_SOURCE_USER: ${PG_EXPORTER_USER}${SUFFIX}
            DATA_SOURCE_PASS_FILE: /run/secrets/pg_exporter_password
        command:
            - --collector.long_running_transactions
            - --collector.database_wraparound
            - --collector.stat_checkpointer
            - --collector.stat_wal_receiver
            - --collector.postmaster
        secrets:
            - pg_exporter_password
        # Mismo criterio que postgres-exporter01dev.
        networks:
            - backend
            - exporters
        depends_on:
            postgres02dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Exporters de Prometheus para PostgreSQL **************************

    # *********************        Inicio Servicios de base de datos para MongoDB *********************
    # Primario
    mongo01dev:
        build:
            context: ./MongoDB
        container_name: ${MONGO_HOST}01${SUFFIX}
        hostname: ${MONGO_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO), mismo criterio/set que Postgres:
        # entrypoint-wrapper.sh corre como root para el "install -o mongodb
        # -g mongodb" del keyfile (chown+chmod 400) antes de "exec gosu
        # mongodb mongod ...". Confirmado con un bootstrap completo del
        # replica set (rs.initiate + creación de usuarios) sobre un volumen
        # nuevo y "cat /proc/1/status" con CapEff en 0 para el mongod ya
        # corriendo.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        deploy:
            resources:
                limits:
                    memory: 768M
                    cpus: "1.0"
        environment:
            MONGO_ROLE: primary
            MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
            MONGO_PRIMARY_HOST: ${MONGO_HOST}01${SUFFIX}
            MONGO_SECONDARY_HOST: ${MONGO_HOST}02${SUFFIX}
            MONGO_ARBITER_HOST: ${MONGO_HOST}-arbiter${SUFFIX}
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}${SUFFIX}
            MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_mongo_password
            MONGO_USER: ${MONGO_USER}${SUFFIX}
            MONGO_USER_PASSWORD_FILE: /run/secrets/db_mongo_user_password
            MONGO_USER_LOGS: ${MONGO_USER_LOGS}${SUFFIX}
            MONGO_USER_LOGS_PASSWORD_FILE: /run/secrets/db_mongo_logs
            MONGO_EXPORTER_USER: ${MONGO_EXPORTER_USER}${SUFFIX}
            MONGO_EXPORTER_PASSWORD_FILE: /run/secrets/db_mongo_exporter
            MPONGO_DB_NAME: ${MPONGO_DB_NAME}
            MONGO_DB_LOGS: ${MONGO_DB_LOGS}
        secrets:
            - mongodb_keyfile
            - db_mongo_password
            - db_mongo_user_password
            - db_mongo_logs
            - db_mongo_exporter
        volumes:
            - mongo_primary_data:/data/db
        networks:
            - backend
        healthcheck:
            # No solo ping: confirma vía rs.status().myState que el nodo esté
            # realmente en rol PRIMARY (1), no solo que el proceso responda.
            # Requiere auth porque para este punto ya existen usuarios (Fix 2).
            test: ["CMD-SHELL", "mongosh --quiet --host localhost -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$(cat /run/secrets/db_mongo_password)\" --authenticationDatabase admin --eval \"quit(rs.status().myState === 1 ? 0 : 1)\" || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    # Replica
    mongo02dev:
        build:
            context: ./MongoDB
        container_name: ${MONGO_HOST}02${SUFFIX}
        hostname: ${MONGO_HOST}02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que mongo01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        deploy:
            resources:
                limits:
                    memory: 768M
                    cpus: "1.0"
        environment:
            MONGO_ROLE: secondary
            MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
            # Solo lo necesario para que el healthcheck pueda autenticar y
            # consultar rs.status(); este nodo no ejecuta init.sh (eso corre
            # únicamente en el primario), así que no necesita el resto de
            # credenciales de usuarios funcionales.
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}${SUFFIX}
        secrets:
            - mongodb_keyfile
            - db_mongo_password
        volumes:
            - mongo_secondary_data:/data/db
        networks:
            - backend
        depends_on:
            - mongo01dev
        healthcheck:
            # No solo ping: confirma vía rs.status().myState que el nodo esté
            # realmente en rol SECONDARY (2), no solo que el proceso responda.
            test: ["CMD-SHELL", "mongosh --quiet --host localhost -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$(cat /run/secrets/db_mongo_password)\" --authenticationDatabase admin --eval \"quit(rs.status().myState === 2 ? 0 : 1)\" || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    # Arbiter: con solo 2 miembros votantes (primario + secundario), si el
    # primario cae, el secundario queda con 1 de 2 votos -sin mayoría- y NO
    # puede auto-promoverse: el replica set entero queda de solo lectura
    # hasta una intervención manual (rs.reconfig con force). El arbiter suma
    # un tercer voto (sin datos) para que sí exista mayoría automática.
    #
    # Trade-off aceptado conscientemente: en topología PSA (Primary-Secondary-
    # Arbiter), si en cambio es el SECUNDARIO de datos el que cae (no el
    # primario), las escrituras con writeConcern "majority" se bloquean,
    # porque el arbiter no tiene datos y no puede acknowledgearlas -son 3
    # miembros, se necesitan 2 acks con datos reales, y solo queda el
    # primario-. El arbiter compra failover automático a costa de introducir
    # ESE modo de degradación nuevo (antes inexistente con 2 miembros).
    mongo-arbiterdev:
        build:
            context: ./MongoDB
        container_name: ${MONGO_HOST}-arbiter${SUFFIX}
        hostname: ${MONGO_HOST}-arbiter${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que mongo01dev (mismo entrypoint-wrapper.sh, mismo
        # paso de keyfile como root antes del gosu).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        # Un arbiter no guarda datos de usuario: footprint mínimo.
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"
        environment:
            MONGO_ROLE: arbiter
            MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
        secrets:
            - mongodb_keyfile
        volumes:
            - mongo_arbiter_data:/data/db
        networks:
            - backend
        depends_on:
            - mongo01dev
        healthcheck:
            # Liveness simple: un arbiter no tiene rol PRIMARY/SECONDARY con
            # datos que verificar, solo debe estar vivo para poder votar.
            test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    # **************************    FIN Servicios de base de datos para MongoDB **************************

    # *********************        Inicio Exporters de Prometheus para MongoDB *********************
    # Un exporter por nodo con datos (mongo01dev/mongo02dev). El arbiter NO
    # tiene exporter propio: no guarda datos ni sirve tráfico de aplicación,
    # así que no hay métricas de negocio que aportar -su único estado
    # relevante (si está arriba y votando) ya se ve reflejado en las métricas
    # de replicasetstatus que exportan los otros dos nodos-.
    #
    # Con Dockerfile propio (MongoDB/Exporter/): la imagen oficial
    # (percona/mongodb_exporter) es FROM scratch, sin shell, y solo acepta
    # MONGODB_PASSWORD en texto plano -no soporta leer el secret desde
    # archivo nativamente-, así que hace falta el wrapper para resolverlo en
    # runtime. Reutiliza MONGO_EXPORTER_USER / db_mongo_exporter (roles
    # clusterMonitor@admin + read@local, ver MongoDB/init.sh) - el mismo
    # usuario que ya vive en "admin" y replica vía oplog a mongo02dev.
    mongo-exporter01dev:
        build:
            context: ./MongoDB/Exporter
        container_name: ${MONGO_HOST}-exporter01${SUFFIX}
        hostname: ${MONGO_HOST}-exporter01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): USER fijo (65535:65535) sin ninguna
        # operación de root en el wrapper -solo lee el secret y exec-, así
        # que cap_drop:[ALL] sin cap_add alcanza (confirmado arrancando así).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            MONGO_EXPORTER_USER: ${MONGO_EXPORTER_USER}${SUFFIX}
            MONGO_EXPORTER_PASSWORD_FILE: /run/secrets/db_mongo_exporter
            # directConnection=true: cada exporter apunta al mongod local de
            # SU contenedor, no quiere que el driver descubra el resto del
            # replica set y decida enrutar la conexión a otro nodo.
            MONGO_TARGET_URI: "mongodb://${MONGO_HOST}01${SUFFIX}:27017/?authSource=admin&directConnection=true"
        # Colectores elegidos para que alcancen con los permisos ya
        # otorgados (clusterMonitor@admin + read@local, "no hace falta nada
        # más" según el estándar del propio percona/mongodb_exporter): NO se
        # habilita --collect-all a propósito, porque incluiría dbstats/
        # collstats/indexstats/topmetrics (necesitan permiso de lectura por
        # base, que clusterMonitor no otorga) y shards/pbm (no aplican acá:
        # no hay sharding ni Percona Backup). diagnosticdata cubre el grueso
        # de las métricas de servidor (conexiones, memoria, opcounters,
        # WiredTiger); replicasetstatus/replicasetconfig cubren el estado
        # del replica set (rol, salud, lag, config de miembros).
        command:
            - --collector.diagnosticdata
            - --collector.replicasetstatus
            - --collector.replicasetconfig
            - --collector.fcv
            - --collector.exporter-metrics
            - --compatible-mode
        secrets:
            - db_mongo_exporter
        # "exporters" además de "backend": ver hallazgo de auditoría junto a
        # la definición de esa red más arriba.
        networks:
            - backend
            - exporters
        depends_on:
            mongo01dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9216/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

    mongo-exporter02dev:
        build:
            context: ./MongoDB/Exporter
        container_name: ${MONGO_HOST}-exporter02${SUFFIX}
        hostname: ${MONGO_HOST}-exporter02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que mongo-exporter01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            MONGO_EXPORTER_USER: ${MONGO_EXPORTER_USER}${SUFFIX}
            MONGO_EXPORTER_PASSWORD_FILE: /run/secrets/db_mongo_exporter
            MONGO_TARGET_URI: "mongodb://${MONGO_HOST}02${SUFFIX}:27017/?authSource=admin&directConnection=true"
        command:
            - --collector.diagnosticdata
            - --collector.replicasetstatus
            - --collector.replicasetconfig
            - --collector.fcv
            - --collector.exporter-metrics
            - --compatible-mode
        secrets:
            - db_mongo_exporter
        # Mismo criterio que mongo-exporter01dev.
        networks:
            - backend
            - exporters
        depends_on:
            mongo02dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9216/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Exporters de Prometheus para MongoDB **************************

    # *********************        Inicio Servicios de base de datos para MSSQL *********************
    # Primario
    mssql01dev:
        build:
            context: ./MsSQL
        container_name: ${MSSQL_HOST}01${SUFFIX}
        hostname: ${MSSQL_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): a diferencia de Postgres/Mongo, este
        # contenedor arranca DIRECTO como "USER mssql" (sin paso de root en
        # runtime, el chmod ya se hizo en build time -ver MsSQL/Dockerfile-),
        # así que necesita MUCHO menos. Con cap_drop:[ALL] y CERO cap_add,
        # sqlservr falla al arrancar con "Operation not permitted" -el
        # binario trae un file capability propio (cap_net_bind_service=ep,
        # "getcap /opt/mssql/bin/sqlservr") que no-new-privileges bloquea si
        # esa capability no está ya en el set permitido del proceso-.
        # NET_BIND_SERVICE es lo único que hace falta: confirmado con un
        # arranque completo desde volumen nuevo (upgrade de msdb/tempdb
        # incluido) y una consulta real por sqlcmd.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        # SQL Server exige ~2GB de RAM como mínimo para arrancar (requisito
        # conocido del motor); no bajar este límite o el contenedor no levanta.
        deploy:
            resources:
                limits:
                    memory: 2g
                    cpus: "2.0"
        environment:
            MSSQL_SA_PASSWORD_FILE: /run/secrets/mssql_password
        secrets:
            - mssql_password
        volumes:
            - mssql_primary_data:/var/opt/mssql
            - ../corporate-secrets/Development/certs:/var/opt/mssql/certs
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/secrets/mssql_password)\" -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s

    # Replica
    mssql02dev:
        build:
            context: ./MsSQL
        container_name: ${MSSQL_HOST}02${SUFFIX}
        hostname: ${MSSQL_HOST}02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que mssql01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        # Ver nota de mssql01dev: SQL Server exige ~2GB de RAM para arrancar.
        deploy:
            resources:
                limits:
                    memory: 2g
                    cpus: "2.0"
        environment:
            MSSQL_SA_PASSWORD_FILE: /run/secrets/mssql_password
        secrets:
            - mssql_password
        volumes:
            - mssql_secondary_data:/var/opt/mssql
            - ../corporate-secrets/Development/certs:/var/opt/mssql/certs
        networks:
            - backend
        depends_on:
            mssql01dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/secrets/mssql_password)\" -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s

    # Job de un solo uso: arma el Availability Group (certificado, endpoint, AG, base y auto-seeding)
    mssql-initdev:
        profiles: ["init"]
        build:
            context: ./MsSQL
        container_name: ${MSSQL_HOST}-init${SUFFIX}
        hostname: ${MSSQL_HOST}-init${SUFFIX}
        restart: "no"
        # A diferencia de mssql01dev/02dev, este job solo corre "sqlcmd"
        # (cliente puro, "getcap /opt/mssql-tools18/bin/sqlcmd" no devuelve
        # ningún file capability) contra las otras instancias -no arranca
        # sqlservr localmente-, así que ni siquiera NET_BIND_SERVICE hace
        # falta acá.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Job de un solo uso, liviano (solo corre sqlcmd contra las otras
        # instancias): no necesita nada cercano a los 2GB de un motor MSSQL.
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        entrypoint: ["/bin/bash", "/scripts/setup-ag.sh"]
        environment:
            MSSQL_PRIMARY_HOST: ${MSSQL_HOST}01${SUFFIX}
            MSSQL_SECONDARY_HOST: ${MSSQL_HOST}02${SUFFIX}
            MSSQL_AG_NAME: ${MSSQL_AG}
            MSSQL_DATABASE: ${MSSQL_DBNAME}
            MSSQL_SA_PASSWORD_FILE: /run/secrets/mssql_password
            MSSQL_EXPORTER_USER: ${MSSQL_EXPORTER_USER}${SUFFIX}
            MSSQL_EXPORTER_PASSWORD_FILE: /run/secrets/mssql_exporter_password
            MSSQL_APP_USER: ${MSSQL_APP_USER}${SUFFIX}
            MSSQL_APP_USER_PASSWORD_FILE: /run/secrets/mssql_app_password
        secrets:
            - mssql_password
            - mssql_exporter_password
            - mssql_app_password
        volumes:
            - ./MsSQL/scripts:/scripts:ro
            - ../corporate-secrets/Development/certs:/certs
        networks:
            - backend
        depends_on:
            mssql01dev:
                condition: service_healthy
            mssql02dev:
                condition: service_healthy

    # **************************    FIN Servicios de base de datos para MSSQL **************************

    # *********************        Inicio Exporters de Prometheus para MSSQL *********************
    # Un exporter por nodo, apuntando cada uno a su propia instancia local.
    #
    # Exporter elegido: burningalchemist/sql_exporter (queries SQL propias
    # via YAML), NO awaragi/prometheus-mssql-exporter -que da un set fijo de
    # ~25 métricas pero sin ninguna cobertura de AlwaysOn Availability
    # Groups-. Como este proyecto vive de un AG (mssql01dev/mssql02dev,
    # ver MsSQL/scripts/setup-ag.sh), un exporter que no pueda ver el estado
    # del AG (rol, salud de sincronización, log_send_queue/redo_queue por
    # base) se queda corto del pedido de monitoreo "detallado y completo".
    # El costo de esa elección es tener que escribir las queries a mano
    # (ver MsSQL/Exporter/collectors/*.collector.yml) en vez de usar un
    # exporter "de métricas fijas" listo para usar.
    #
    # Con Dockerfile propio (MsSQL/Exporter/): sql_exporter arma su target
    # (DSN) desde un archivo de configuración en texto plano, no soporta
    # leer la contraseña desde un Docker secret nativamente (solo backends
    # de secret managers en la nube), así que el wrapper genera ese archivo
    # en runtime con el password resuelto desde /run/secrets/.
    #
    # profiles: ["mssql-monitoring"] -A DIFERENCIA de los otros 6 exporters
    # (Postgres/Mongo/Redis), estos dos NO arrancan con el "up --wait" normal.
    # Motivo (bug real, encontrado por reality-checker con evidencia de un
    # "run.ps1 bdd dev" real desde cero): el healthcheck de este exporter
    # (wget a /metrics) solo pasa una vez que el login SQL
    # MSSQL_EXPORTER_USER existe, y ese login lo crea ÚNICAMENTE
    # mssql-initdev (dentro de setup-ag.sh) -que corre DESPUÉS del "up --wait"
    # inicial, no antes-. Sin profile propio, estos dos exporters quedan en
    # el profile default y "up --wait" los espera junto con todo lo demás;
    # como el login todavía no existe en ese momento, su healthcheck nunca
    # pasa, "up --wait" agota sus 300s y falla, y mssql-initdev NUNCA llega a
    # correr -deadlock circular, 100% reproducible-. Separarlos en su propio
    # profile los saca del "up" inicial; infra.ps1 los trae arriba en un paso
    # aparte, DESPUÉS de que mssql-initdev termine y el login ya exista.
    #
    # (El exporter en sí no tiene ningún bug: si arranca antes de que el
    # login exista, sql_exporter no crashea, solo reporta esa métrica de
    # scrape puntual como error y se autocura solo en el siguiente scrape
    # -confirmado con un test real-; el problema era puramente de orden de
    # arranque contra el timeout del "up --wait" inicial.)
    mssql-exporter01dev:
        profiles: ["mssql-monitoring"]
        build:
            context: ./MsSQL/Exporter
        container_name: ${MSSQL_HOST}-exporter01${SUFFIX}
        hostname: ${MSSQL_HOST}-exporter01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): USER nobody, wrapper solo escribe
        # /tmp/sql_exporter.yml (world-writable por defecto) y exec's
        # sql_exporter -sin ninguna operación de root-, así que
        # cap_drop:[ALL] sin cap_add alcanza (confirmado sirviendo /metrics
        # normalmente).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            MSSQL_EXPORTER_USER: ${MSSQL_EXPORTER_USER}${SUFFIX}
            MSSQL_EXPORTER_PASSWORD_FILE: /run/secrets/mssql_exporter_password
            MSSQL_TARGET_HOST: ${MSSQL_HOST}01${SUFFIX}
        secrets:
            - mssql_exporter_password
        # "exporters" además de "backend": ver hallazgo de auditoría junto a
        # la definición de esa red más arriba.
        networks:
            - backend
            - exporters
        depends_on:
            mssql01dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9399/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

    mssql-exporter02dev:
        profiles: ["mssql-monitoring"]
        build:
            context: ./MsSQL/Exporter
        container_name: ${MSSQL_HOST}-exporter02${SUFFIX}
        hostname: ${MSSQL_HOST}-exporter02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que mssql-exporter01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            MSSQL_EXPORTER_USER: ${MSSQL_EXPORTER_USER}${SUFFIX}
            MSSQL_EXPORTER_PASSWORD_FILE: /run/secrets/mssql_exporter_password
            MSSQL_TARGET_HOST: ${MSSQL_HOST}02${SUFFIX}
        secrets:
            - mssql_exporter_password
        # Mismo criterio que mssql-exporter01dev.
        networks:
            - backend
            - exporters
        depends_on:
            mssql02dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9399/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Exporters de Prometheus para MSSQL **************************

    # *********************        Inicio Servicios de base de datos para Redis *********************
    # Primario
    redis01dev:
        build:
            context: ./Redis
        container_name: ${REDIS_HOST}01${SUFFIX}
        hostname: ${REDIS_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): entrypoint-wrapper.sh corre como
        # root para "chown -R redis:redis /data" (hallazgo ALTO, ver más
        # arriba) antes de "exec su-exec redis ..." -CHOWN para el chown en
        # sí, SETUID+SETGID para que su-exec pueda cambiar de usuario-. Sin
        # FOWNER/DAC_OVERRIDE: el chown syscall en sí solo necesita CHOWN: no
        # se está tocando ningún archivo que el proceso no pueda ya
        # modificar por ownership normal una vez con ese capability.
        # Confirmado con volumen nuevo Y con un volumen clonado del real
        # (root:root de antes de este hardening) -ambos escenarios, ver
        # hallazgo Redis root-.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        environment:
            REDIS_ROLE: primary
            REDIS_PASSWORD_FILE: /run/secrets/redis_password
            REDIS_EXPORTER_USER: ${REDIS_EXPORTER_USER}${SUFFIX}
            REDIS_EXPORTER_PASSWORD_FILE: /run/secrets/redis_exporter_password
        secrets:
            - redis_password
            - redis_exporter_password
        volumes:
            - redis_primary_data:/data
        networks:
            - backend
        healthcheck:
            # Además del ping, confirma que el nodo se vea a sí mismo como
            # master (role:master en INFO replication) y no, por ejemplo,
            # como replica huérfana tras una reconfiguración manual.
            test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG && redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning info replication | grep -q '^role:master'"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s

    # Replica
    redis02dev:
        build:
            context: ./Redis
        container_name: ${REDIS_HOST}02${SUFFIX}
        hostname: ${REDIS_HOST}02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que redis01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        environment:
            REDIS_ROLE: replica
            REDIS_PRIMARY_HOST: ${REDIS_HOST}01${SUFFIX}
            REDIS_PASSWORD_FILE: /run/secrets/redis_password
            REDIS_EXPORTER_USER: ${REDIS_EXPORTER_USER}${SUFFIX}
            REDIS_EXPORTER_PASSWORD_FILE: /run/secrets/redis_exporter_password
        secrets:
            - redis_password
            - redis_exporter_password
        volumes:
            - redis_replica_data:/data
        networks:
            - backend
        depends_on:
            redis01dev:
                condition: service_healthy
        healthcheck:
            # Además del ping, confirma que el link de replicación hacia el
            # primario esté realmente arriba (master_link_status:up), no solo
            # que el proceso redis-server responda.
            test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG && redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning info replication | grep -q 'master_link_status:up'"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s

    # **************************    FIN Servicios de base de datos para Redis **************************

    # *********************        Inicio Exporters de Prometheus para Redis *********************
    # Un exporter por nodo. Con Dockerfile propio (Redis/Exporter/): la
    # imagen oficial (oliver006/redis_exporter) solo acepta REDIS_PASSWORD en
    # texto plano -su "-redis.password-file" espera un JSON keyed por
    # dirección, no un secreto "un archivo = un valor" como el resto de este
    # proyecto-, así que el wrapper resuelve el secret en runtime. Usa el
    # usuario ACL de solo-lectura creado en Redis/entrypoint-wrapper.sh
    # (REDIS_EXPORTER_USER / redis_exporter_password).
    redis-exporter01dev:
        build:
            context: ./Redis/Exporter
        container_name: ${REDIS_HOST}-exporter01${SUFFIX}
        hostname: ${REDIS_HOST}-exporter01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): USER fijo (59000:59000), wrapper
        # solo lee el secret y exec's -sin operaciones de root-, así que
        # cap_drop:[ALL] sin cap_add alcanza.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            REDIS_EXPORTER_USER: ${REDIS_EXPORTER_USER}${SUFFIX}
            REDIS_EXPORTER_PASSWORD_FILE: /run/secrets/redis_exporter_password
            REDIS_TARGET_ADDR: redis://${REDIS_HOST}01${SUFFIX}:6379
        # -include-config-metrics y -include-system-metrics dan visibilidad
        # extra (config efectiva del server, memoria total del SO) más allá
        # de lo que INFO expone por defecto; ambos ya cubiertos por el ACL
        # (+config|get). -export-client-list agrega métricas por cliente
        # conectado (+client ya otorgado). El resto de lo pedido -
        # replicación, memoria, comandos lentos, keyspace- ya viene en las
        # secciones por defecto de INFO, sin flags adicionales.
        command:
            - -include-config-metrics
            - -include-system-metrics
            - -export-client-list
        secrets:
            - redis_exporter_password
        # "exporters" además de "backend": ver hallazgo de auditoría junto a
        # la definición de esa red más arriba.
        networks:
            - backend
            - exporters
        depends_on:
            redis01dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9121/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

    redis-exporter02dev:
        build:
            context: ./Redis/Exporter
        container_name: ${REDIS_HOST}-exporter02${SUFFIX}
        hostname: ${REDIS_HOST}-exporter02${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que redis-exporter01dev.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            REDIS_EXPORTER_USER: ${REDIS_EXPORTER_USER}${SUFFIX}
            REDIS_EXPORTER_PASSWORD_FILE: /run/secrets/redis_exporter_password
            REDIS_TARGET_ADDR: redis://${REDIS_HOST}02${SUFFIX}:6379
        command:
            - -include-config-metrics
            - -include-system-metrics
            - -export-client-list
        secrets:
            - redis_exporter_password
        # Mismo criterio que redis-exporter01dev.
        networks:
            - backend
            - exporters
        depends_on:
            redis02dev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9121/metrics >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Exporters de Prometheus para Redis **************************

    # *********************        Proxy único: NGINX (stream/L4) *********************
    # Único servicio con puertos publicados al host. Ninguna base de datos expone
    # puertos directamente; todo el tráfico entra por acá y se reenvía al nodo
    # primario de cada motor (ver corporate-infra/NGINX/config/streams.dev.conf).
    nginxdev:
        build:
            context: ./NGINX
        container_name: ${NGINX_HOST}${SUFFIX}
        hostname: ${NGINX_HOST}${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): el master process de nginx necesita
        # quedarse root (arquitectura propia de nginx: administra los
        # workers), pero con CHOWN+SETUID+SETGID alcanza para que baje los
        # WORKERS -los que realmente manejan tráfico- al usuario "nginx" sin
        # privilegios. Confirmado con "cat /proc/{pid}/status" por cada
        # worker: CapEff en 0 para los 12 workers, master con exactamente
        # estos 3 caps (0xc1), no el set completo por defecto. Puertos
        # internos todos >1024 (ver corporate-infra/NGINX/config/
        # streams.dev.conf): no hace falta NET_BIND_SERVICE.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        # Proxy L4 puro, sin estado: footprint trivial.
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"
        environment:
            DEPLOY_ENV: ${SUFFIX}
            SUFFIX: ${SUFFIX}
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRE_PORT: ${POSTGRE_PORT}
            MONGO_HOST: ${MONGO_HOST}
            MONGO_PORT: ${MONGO_PORT}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}
            MSSQL_HOST: ${MSSQL_HOST}
            MSSQL_PORT: ${MSSQL_PORT}
        # Bindeados a ALLOCATED_IP (la IP de LAN del anfitrion, ver
        # corporate-secrets/Environment/.env), no a 0.0.0.0 -hallazgo de
        # auditoria: sin esto, Docker publica en TODAS las interfaces del
        # host (VPN, WiFi, etc.), no solo la red corporativa prevista.
        ports:
            - "${ALLOCATED_IP}:${POSTGRE_PORT}:${POSTGRE_PORT}"
            - "${ALLOCATED_IP}:${MONGO_PORT}:${MONGO_PORT}"
            - "${ALLOCATED_IP}:${REDIS_PORT}:${REDIS_PORT}"
            - "${ALLOCATED_IP}:${MSSQL_PORT}:${MSSQL_PORT}"
        # Dual-homed: "backend" (internal, para reenviar hacia el nodo
        # primario de cada motor) + "public" (NO internal, solo para que
        # Docker pueda publicar los 4 puertos de arriba al host -ver la
        # definición de "public" más arriba: en este host, una red
        # "internal: true" bloquea por completo el port-publish, confirmado
        # en la práctica-). nginxdev es el ÚNICO servicio de este archivo
        # conectado a "public": todos los motores/exporters se quedan solo en
        # "backend"/"exporters" (ambas internal), sin egreso real y sin
        # siquiera ruta hacia "public".
        networks:
            - backend
            - public
        depends_on:
            postgres01dev:
                condition: service_healthy
            mongo01dev:
                condition: service_healthy
            redis01dev:
                condition: service_healthy
            mssql01dev:
                condition: service_healthy
    # **************************    FIN Proxy NGINX **************************
