# Reenvío TCP hacia el nodo PRIMARIO de cada motor. Los puertos externos salen
# de corporate-secrets/Development/.env; los hosts internos de corporate-secrets/Environment/.env.
#
# proxy_pass apunta a una variable ($xxx_upstream), no al hostname literal:
# con un literal, nginx resolvería la IP UNA sola vez al arrancar el worker y
# la dejaría cacheada para siempre, aunque el contenedor de la BD se recree
# con otra IP. Al pasar por "set" + variable, nginx re-resuelve el hostname
# en cada conexión nueva usando el "resolver" definido en nginx.conf.template
# (TTL 10s). Cada bloque usa un nombre de variable propio para no colisionar.

# PostgreSQL
server {
    listen ${POSTGRE_PORT};
    set $pg_upstream ${POSTGRES_HOST}01${SUFFIX}:5432;
    proxy_pass $pg_upstream;
}

# MongoDB
server {
    listen ${MONGO_PORT};
    set $mongo_upstream ${MONGO_HOST}01${SUFFIX}:27017;
    proxy_pass $mongo_upstream;
}

# Redis
server {
    listen ${REDIS_PORT};
    set $redis_upstream ${REDIS_HOST}01${SUFFIX}:6379;
    proxy_pass $redis_upstream;
}

# MSSQL
server {
    listen ${MSSQL_PORT};
    set $mssql_upstream ${MSSQL_HOST}01${SUFFIX}:1433;
    proxy_pass $mssql_upstream;
}
