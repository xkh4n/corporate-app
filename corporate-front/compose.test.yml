name: ${PROJECT_NAME_FRONTEND}${SUFFIX}

networks:
    # Red propia de este stack: solo el proceso de Vite y su proxy NGINX
    # (mismo patron que "internal" en corporate-api/compose.test.yml).
    # internal: true -Vite nunca necesita salida a ningun lado, solo lo
    # alcanza nginx-fronttest por aca.
    internal:
        name: ${PROJECT_NAME_FRONTEND}_internal${SUFFIX}
        internal: true
        ipam:
            config:
                - subnet: 10.10.7.0/24
    # Red pre-creada por "run.ps1 frontend <ambiente>" (ver root run.ps1),
    # externa a este stack. Solo el proxy NGINX se conecta acá -mismo patron
    # de "un solo punto de entrada" que el resto del proyecto-, nunca el
    # proceso de Vite directamente.
    #
    # DELIBERADAMENTE sigue SIN "internal: true" (mismo hallazgo documentado
    # en corporate-api/compose.test.yml para "public"/backend-net: en este
    # host, Docker Desktop/WSL2, una red "--internal" impide que Docker
    # publique el puerto al host, confirmado en la practica).
    frontend-net:
        external: true
        name: frontend-net-${SUFFIX}
    # Red compartida con corporate-api (ver comentario gemelo en
    # corporate-api/compose.test.yml, red "frontapi-net"): reemplaza el
    # intento inicial de pegarle a corporate-api via ALLOCATED_IP (hairpin
    # NAT, intermitente en Docker Desktop/Windows) o via host.docker.internal
    # (hubiera exigido exponer nginx-apidev en 0.0.0.0). Solo nginx-fronttest
    # se conecta aca, nunca el proceso de Vite directamente.
    frontapi-net:
        external: true
        name: frontapi-net-${SUFFIX}

services:
    # ****************    Vite dev server (hot-reload) — 1 sola instancia ****************
    # Una sola replica a proposito: el websocket de HMR tiene estado por
    # conexion, balancearlo entre varias instancias (como las 3 replicas de
    # la API) rompe el hot-reload. Sin NGINX/TLS propio: nadie fuera de
    # Docker lo llama directo, solo nginx-fronttest dentro de "internal".
    frontendtest:
        image: ${PROJECT_NAME_FRONTEND}-app:${SUFFIX}
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: ${APP_HOST}${SUFFIX}
        hostname: ${APP_HOST}${SUFFIX}
        restart: ${RESTART_POLICY}
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"
        environment:
            # Puerto donde "serve" expone el bundle estatico (ver
            # corporate-front/Dockerfile) -mismo puerto que nginx-fronttest/
            # test/prod ya espera como upstream (front_static, ver
            # nginx.conf.prod.template), no hace falta tocar el proxy.
            FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT}
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:${FRONT_INTERNAL_PORT}/ >/dev/null 2>&1 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
    # **************************    FIN Vite dev server **************************

    # *********************        Proxy único: NGINX (TLS + reverse proxy) *********************
    # Único servicio de este stack con puertos publicados al host, mismo
    # criterio que corporate-api/corporate-infra/corporate-monitoring.
    # Proxea "/" a frontendtest (con soporte de websocket para HMR) y "/api/"
    # a nginx-apidev de corporate-api, via la red compartida "frontapi-net"
    # (ver nginx/config/nginx.conf.template) -stacks Compose independientes
    # igual que corporate-mailer, pero conectados por una red dedicada de un
    # solo consumidor por lado, mismo patron que mailer-net.
    nginx-fronttest:
        build:
            context: ./nginx
        container_name: ${APP_PROXY_HOST}${SUFFIX}
        hostname: ${APP_PROXY_HOST}${SUFFIX}
        restart: ${RESTART_POLICY}
        # Mismo criterio que nginx-apidev: el master process necesita
        # quedarse root, pero CHOWN+SETUID+SETGID alcanza para que baje los
        # workers (los que manejan trafico real) a "nginx" sin privilegios.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            APP_HOST: ${APP_HOST}
            FRONT_INTERNAL_PORT: ${FRONT_INTERNAL_PORT}
            SUFFIX: ${SUFFIX}
            FRONT_SSL_PORT: ${FRONT_SSL_PORT}
            # Destino del proxy "/api/" (ver nginx.conf.template): nombre de
            # contenedor de nginx-apidev, alcanzable via Docker DNS en
            # "frontapi-net" (mismo host resuelto que su container_name).
            API_PROXY_HOST: ${API_PROXY_HOST}
            # Selecciona la plantilla de nginx (dev con HMR/vite-proxy vs
            # produccion con bundle estatico) -ver entrypoint-wrapper.sh.
            NODE_ENV: ${NODE_ENV}
        # Bindeado a ALLOCATED_IP, no a 0.0.0.0 -mismo criterio que el resto
        # del proyecto, ver comentario en corporate-infra/compose.test.yml.
        ports:
            - "${ALLOCATED_IP}:${FRONT_PORT}:80"
            - "${ALLOCATED_IP}:${FRONT_SSL_PORT}:443"
        volumes:
            # tls.crt/tls.key: autofirmados por defecto (ver
            # corporate-scripts/ensure-front-tls-cert.ps1), reemplazables
            # por los de una CA real con el mismo nombre de archivo sin
            # tocar este compose ni nginx.conf.template. Solo lectura.
            - ../corporate-secrets/${SECRETS_ENV}/certs/front:/etc/nginx/certs:ro
        networks:
            - internal
            - frontend-net
            - frontapi-net
        depends_on:
            frontendtest:
                condition: service_healthy
    # **************************    FIN Proxy NGINX **************************
