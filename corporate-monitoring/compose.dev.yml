name: ${PROJECT_NAME_MONITORING}${SUFFIX}

secrets:
    gf_admin_password:
        file: ../corporate-secrets/${SECRETS_ENV}/gf_admin_password.txt
    gf_user_password:
        file: ../corporate-secrets/${SECRETS_ENV}/gf_user_password.txt

networks:
    # Red propia de este stack (equivalente a "backend" en corporate-infra):
    # Loki, Alloy, Grafana y el proxy NGINX viven acá.
    # internal: true -hallazgo CRITICO de auditoria: sin esto, cualquiera de
    # estos contenedores (Grafana, Alloy, Loki, Prometheus) tenia egreso NAT
    # real a internet. Ninguno lo necesita: Grafana/Loki/Alloy solo se hablan
    # entre si por esta red. nginxmondev YA NO se queda solo acá -ver la red
    # "public" más abajo-: se probó en la práctica (no se asumió) que en este
    # host una red "internal: true" bloquea por completo el port-publish al
    # host, no solo el egreso a internet, así que nginxmondev necesita una
    # segunda red sin "internal" solo para eso.
    monitoring:
        name: ${PROJECT_NAME_MONITORING}_monitoring${SUFFIX}
        internal: true
        ipam:
            config:
                - subnet: 172.16.8.0/24
    # Red del OTRO proyecto Compose (corporate-infra), declarada "external"
    # porque ya existe (la crea "corpinfra dev" al levantar ese stack) y este
    # proyecto no es dueño de ella. Apunta a "exporters", NO a "backend"
    # -hallazgo de auditoría (MEDIO, defensa en profundidad): "backend" en
    # corporate-infra tiene también a los 4 motores de BD, no solo a sus
    # exporters; conectarse ahí le daría a Prometheus RUTA de red directa
    # hacia postgres01dev:5432/mongo01dev:27017/redis01dev:6379/
    # mssql01dev:1433, bloqueada hoy únicamente por la autenticación de cada
    # motor (ya confirmada sólida por el auditor), no por la red. "exporters"
    # (ver corporate-infra/compose.dev.yml) es una red separada que solo
    # contiene a los 8 exporters -dual-homed ahí y en "backend"-, nunca a los
    # motores en sí-. Prometheus es el ÚNICO servicio de este archivo que se
    # conecta acá -Loki/Alloy/Grafana no necesitan hablar con los exporters
    # directamente-.
    infra-exporters:
        external: true
        name: ${PROJECT_NAME}_exporters${SUFFIX}
    # Red del proyecto Compose de corporate-api (ver ese compose.dev.yml,
    # red "api-exporters"), declarada "external" por el mismo motivo que
    # "infra-exporters": Prometheus necesita alcanzar el /metrics (sin auth,
    # prom-client) de las 3 réplicas de la API, sin tener ruta hacia
    # "internal" ni "infra-backend" -las otras redes de ese stack-.
    api-exporters:
        external: true
        name: ${PROJECT_NAME_BACKEND}_exporters${SUFFIX}
    # Hallazgo CRÍTICO de auditoría, tercera vuelta: con dockerproxydev en la
    # misma red "monitoring" que Alloy, el filtro (dockerproxyfilterdev) era
    # una elección de CONFIGURACIÓN de Alloy, no una barrera real -nada le
    # impide a un Alloy comprometido hablarle directo a "polarisdev" en vez
    # de al filtro, salteándolo por completo (confirmado por el auditor:
    # mismo request de archive que el filtro bloquea con 403, yendo directo
    # a dockerproxydev da 200)-. Docker no da ACLs entre miembros de una
    # misma red bridge, así que la única forma real de forzar "todo pasa por
    # el filtro" es que dockerproxydev viva en una red que Alloy ni siquiera
    # pueda alcanzar. Mismo patrón que ya usa el resto del proyecto (ningún
    # motor de BD es alcanzable salvo a través de su NGINX): acá,
    # dockerproxydev solo es alcanzable a través de dockerproxyfilterdev
    # (dual-homed en "monitoring" + "proxy-internal"); todo lo demás
    # (Alloy incluido) se queda solo en "monitoring".
    # internal: true -mismo motivo que "monitoring": esta red solo conecta
    # dockerproxyfilterdev con dockerproxydev (socket de Docker), nunca
    # necesitó ni necesita salida a internet.
    proxy-internal:
        name: ${PROJECT_NAME_MONITORING}_proxy-internal${SUFFIX}
        internal: true
        ipam:
            config:
                - subnet: 172.16.9.0/24
    # Red exclusiva de nginxmondev, DELIBERADAMENTE SIN "internal: true" -
    # única forma de que Docker publique sus 2 puertos (3333/3334) al host en
    # este entorno (Docker Desktop/WSL2, Windows): confirmado en la práctica.
    # Ni Grafana ni Loki/Alloy/Prometheus/dockerproxyfilterdev se conectan
    # acá, solo nginxmondev (dual-homed con "monitoring").
    public:
        name: ${PROJECT_NAME_MONITORING}_public${SUFFIX}
        ipam:
            config:
                - subnet: 172.16.10.0/24

volumes:
    prometheus_data:
    loki_data:
    grafana_data:

services:
    # *********************        Prometheus: scrapea los 8 exporters de corporate-infra *********************
    prometheusdev:
        build:
            context: ./Prometheus
        container_name: ${PROMETHEUS_HOST}01${SUFFIX}
        hostname: ${PROMETHEUS_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): USER nobody, sin ninguna operación
        # de root en runtime (el wrapper escribe prometheus.yml como nobody,
        # confirmado que /etc/prometheus admite esa escritura sin necesitar
        # ninguna capability). cap_drop:[ALL] sin cap_add alcanza.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        environment:
            # Mismos hosts que usa corporate-infra para nombrar sus propios
            # exporters (${HOST}-exporter0N${SUFFIX}, ver
            # corporate-infra/compose.dev.yml): Prometheus arma los targets de
            # scrape con estos mismos nombres, resueltos por DNS de Docker
            # gracias a "infra-exporters" siendo la misma red donde viven los
            # exporters (NO los motores de BD en sí, ver esa red más arriba).
            SUFFIX: ${SUFFIX}
            POSTGRES_HOST: ${POSTGRES_HOST}
            MONGO_HOST: ${MONGO_HOST}
            REDIS_HOST: ${REDIS_HOST}
            MSSQL_HOST: ${MSSQL_HOST}
            API_HOST: ${API_HOST}
            API_INTERNAL_PORT: ${API_INTERNAL_PORT}
        volumes:
            - prometheus_data:/prometheus
        networks:
            - monitoring
            - infra-exporters
            - api-exporters
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Prometheus **************************

    # *********************        Loki: almacena logs *********************
    lokidev:
        build:
            context: ./Loki
        container_name: ${LOKI_HOST}01${SUFFIX}
        hostname: ${LOKI_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): config estática, sin ninguna
        # operación de root en runtime. cap_drop:[ALL] sin cap_add alcanza.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        volumes:
            - loki_data:/loki
        networks:
            - monitoring
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
    # **************************    FIN Loki **************************

    # *********************        Alloy: recolecta logs de TODOS los contenedores del host *********************
    # Proxy de socket de Docker, de solo lectura y filtrado (tecnativa/docker-
    # socket-proxy). Hallazgo CRÍTICO de auditoría (probado con PoC real, ver
    # config.alloy): montar /var/run/docker.sock directo en un contenedor,
    # aunque sea ":ro", NO limita qué métodos HTTP puede mandar ese
    # contenedor por el socket -el ":ro" es del mount, no de la API-; se
    # demostró crear un contenedor nuevo con acceso al filesystem del host
    # vía POST /containers/create. Este proxy es el ÚNICO componente que
    # monta el socket real; Alloy (y cualquier otro futuro consumidor) le
    # habla por red, nunca al socket directo.
    #
    # Allowlist mínima para lo que Alloy realmente usa (discovery.docker +
    # loki.source.docker, ambos de solo lectura): CONTAINERS=1 habilita GET
    # sobre /containers/* (listar, inspeccionar, leer logs). Todo lo demás
    # que escribe queda en 0 explícito -no confiando en el default-, tanto
    # el switch maestro POST (que por sí solo ya dejaría todo en modo
    # solo-lectura) como cada toggle específico (EXEC, BUILD,
    # ALLOW_START/STOP/RESTART/PAUSE/UNPAUSE): "cinturón y tirantes", para
    # que un solo flag mal seteado no reabra el hueco. Validado con PoC
    # propio antes de este deploy: GET /containers/json y GET .../logs dan
    # 200; POST /containers/create, POST .../exec, POST /build,
    # POST .../attach y PUT .../archive dan 403.
    dockerproxydev:
        image: tecnativa/docker-socket-proxy:v0.5.0
        container_name: ${DOCKERPROXY_HOST}${SUFFIX}
        hostname: ${DOCKERPROXY_HOST}${SUFFIX}
        restart: ${RESTART_POLICY}
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            CONTAINERS: 1
            POST: 0
            EXEC: 0
            BUILD: 0
            ALLOW_START: 0
            ALLOW_STOP: 0
            ALLOW_RESTARTS: 0
            ALLOW_PAUSE: 0
            ALLOW_UNPAUSE: 0
            AUTH: 0
            SECRETS: 0
            IMAGES: 0
            INFO: 0
            # NETWORKS=1: discovery.docker de Alloy llama a GET /networks/{id}
            # para enriquecer cada target con metadata de red (IP, nombre de
            # red) -sin esto, "discovery.docker" fallaba en runtime con 403
            # ("error while computing network labels"), encontrado recién al
            # desplegar el fix real, no en el PoC aislado-. Sigue siendo
            # solo-lectura: POST=0 global bloquea cualquier escritura sobre
            # /networks/* igual (crear/borrar/conectar redes).
            NETWORKS: 1
            NODES: 0
            PLUGINS: 0
            SERVICES: 0
            SESSION: 0
            SWARM: 0
            SYSTEM: 0
            TASKS: 0
            VOLUMES: 0
            COMMIT: 0
            CONFIGS: 0
            DISTRIBUTION: 0
        volumes:
            # El único servicio de todo el repo (corporate-infra +
            # corporate-monitoring) que toca el socket real.
            - /var/run/docker.sock:/var/run/docker.sock
        # SOLO "proxy-internal", NO "monitoring": hallazgo crítico, tercera
        # vuelta -con este contenedor en la misma red que Alloy, el filtro
        # (dockerproxyfilterdev) era una elección de configuración, no una
        # barrera real (Alloy comprometido podía hablarle directo a este
        # host, saltando el filtro por completo; confirmado por el auditor).
        # Ahora dockerproxydev es INALCANZABLE por red desde "monitoring"
        # -el único camino es a través de dockerproxyfilterdev, que sí está
        # en ambas redes-.
        networks:
            - proxy-internal
        security_opt:
            - no-new-privileges:true
        # Hallazgo de auditoría (MEDIO): aunque este proceso corre como root
        # (arranque propio de la imagen oficial de tecnativa, no elegido acá:
        # haproxy no baja privilegios solo), cap_drop:[ALL] SIN ningún
        # cap_add funciona igual -confirmado con un /_ping real exitoso-: el
        # acceso al socket (root:root) lo resuelve el chequeo normal de
        # ownership (uid 0 matchea al dueño), no hace falta DAC_OVERRIDE ni
        # ninguna otra capability de por medio. "CapEff"/"CapBnd" quedan en
        # 0000000000000000 -sin capabilities reales pese a ser uid 0-.
        cap_drop:
            - ALL
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping | grep -q OK || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
    # **************************    FIN Proxy de socket de Docker **************************

    # Filtro L7 (nginx, allowlist explícita de paths) DELANTE de dockerproxydev.
    # Segunda vuelta del hallazgo crítico: el auditor probó con datos reales
    # que CONTAINERS=1 en tecnativa/docker-socket-proxy -necesario para que
    # Alloy pueda listar contenedores y leer logs- también deja pasar
    # GET /containers/{id}/archive?path=... (lee cualquier archivo del
    # filesystem de cualquier contenedor, incluidos los secrets montados en
    # /run/secrets/) y GET /containers/{id}/export (dump completo del
    # filesystem) -ninguno de los dos es una escritura, así que POST=0 no los
    # toca-. tecnativa/docker-socket-proxy no tiene un toggle más fino que
    # "CONTAINERS" completo (confirmado: issue abierto sin resolver en su
    # repo pidiendo justo esto). Este filtro cierra ese hueco con un
    # allowlist propio y más estricto: default-deny, solo pasan
    # /containers/json, /containers/{id}/json, /containers/{id}/logs,
    # /networks*, /version, /_ping, /events -exactamente lo que
    # discovery.docker + loki.source.docker usan, nada más-. Alloy ahora le
    # habla a ESTE filtro, no a dockerproxydev directo (dockerproxydev queda
    # interno incluso para Alloy).
    dockerproxyfilterdev:
        build:
            context: ./DockerProxyFilter
        container_name: ${DOCKERPROXY_FILTER_HOST}${SUFFIX}
        hostname: ${DOCKERPROXY_FILTER_HOST}${SUFFIX}
        restart: ${RESTART_POLICY}
        deploy:
            resources:
                limits:
                    memory: 64M
                    cpus: "0.1"
        environment:
            DOCKERPROXY_HOST: ${DOCKERPROXY_HOST}
            SUFFIX: ${SUFFIX}
        # Dual-homed a propósito (hallazgo crítico, tercera vuelta): en
        # "monitoring" para recibir requests de Alloy, en "proxy-internal"
        # para poder alcanzar a dockerproxydev -el ÚNICO puente entre las dos
        # redes es este contenedor, con su allowlist de por medio-.
        networks:
            - monitoring
            - proxy-internal
        security_opt:
            - no-new-privileges:true
        # Hallazgo de auditoría (MEDIO): mismo criterio que los otros dos
        # NGINX del repo -CHOWN+SETUID+SETGID para que el master (que
        # necesita quedarse root) pueda bajar los workers al usuario "nginx"-.
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        depends_on:
            dockerproxydev:
                condition: service_healthy
        healthcheck:
            # "127.0.0.1" explícito, NO "localhost": nginx acá solo escucha
            # en "0.0.0.0:2375" (IPv4), y el wget de busybox resuelve
            # "localhost" a "::1" (IPv6) primero -con "localhost" el
            # healthcheck daba "Connection refused" en bucle aunque el proxy
            # funcionaba perfecto (confirmado con tráfico real de Alloy en
            # paralelo mientras el healthcheck fallaba), encontrado recién al
            # desplegar-.
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
    # **************************    FIN Filtro del proxy de socket de Docker **************************

    alloydev:
        build:
            context: ./Alloy
        container_name: ${ALLOY_HOST}01${SUFFIX}
        hostname: ${ALLOY_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.25"
        environment:
            LOKI_HOST: ${LOKI_HOST}
            # Le habla al FILTRO (dockerproxyfilterdev), no a dockerproxydev
            # directo -ver dockerproxyfilterdev más arriba, segunda vuelta
            # del hallazgo crítico-.
            DOCKERPROXY_FILTER_HOST: ${DOCKERPROXY_FILTER_HOST}
            SUFFIX: ${SUFFIX}
        # SIN volumes: ya no monta /var/run/docker.sock -habla con
        # dockerproxyfilterdev por red (ver config.alloy)-. Este es justo el
        # cambio que cierra el hallazgo crítico.
        networks:
            - monitoring
        security_opt:
            - no-new-privileges:true
        # Hallazgo de auditoría (MEDIO): USER alloy (473, fijo desde el
        # Dockerfile), sin ninguna operación de root en runtime -ya no toca
        # el socket de Docker, ver el hallazgo crítico más arriba-.
        # cap_drop:[ALL] sin cap_add alcanza.
        cap_drop:
            - ALL
        depends_on:
            lokidev:
                condition: service_healthy
            dockerproxyfilterdev:
                condition: service_healthy
        healthcheck:
            # La imagen oficial de Alloy no trae wget/curl (Ubuntu mínima, sin
            # instalarlos de más solo para esto); "bash -c 'echo >
            # /dev/tcp/...'" es una prueba de conexión TCP pura -bash sí viene
            # incluido- que alcanza para confirmar que el proceso está vivo y
            # escuchando, sin agregar dependencias a la imagen.
            test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/12345' || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
    # **************************    FIN Alloy **************************

    # *********************        Grafana: visualización *********************
    grafanadev:
        build:
            context: ./Grafana
        container_name: ${GRAFANA_HOST}01${SUFFIX}
        hostname: ${GRAFANA_HOST}01${SUFFIX}
        restart: ${RESTART_POLICY}
        # Hallazgo de auditoría (MEDIO): USER 472 (fijo desde el Dockerfile),
        # sin ninguna operación de root en runtime. cap_drop:[ALL] sin
        # cap_add alcanza (confirmado con un arranque completo sobre volumen
        # nuevo y /api/health real).
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"
        environment:
            GF_SECURITY_ADMIN_USER: ${GF_ADMIN}${SUFFIX}
            GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/gf_admin_password
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            # URL externa (la que ve el navegador, a través del proxy NGINX de
            # este stack, NO localhost:3000 interno) -Grafana la usa para
            # armar links absolutos-.
            # https + MONITORING_SSL_PORT: hallazgo de auditoría, Grafana
            # pasó a servirse por TLS (ver nginxmondev/nginx.conf.template),
            # asi que su URL externa real ahora es la HTTPS, no la HTTP.
            GF_SERVER_ROOT_URL: https://${GF_SERVER_ROOT_URL}:${MONITORING_SSL_PORT}
            GF_SECURITY_COOKIE_SAMESITE: lax
            GF_SECURITY_COOKIE_SECURE: "true"
            GF_AUTH_LOGIN_COOKIE_NAME: grafana_session_${SUFFIX}
            GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: "10"
            # Consumidas por provisioning/datasources/datasources.yml
            # (expansión de env vars nativa de Grafana, sin wrapper).
            PROMETHEUS_HOST: ${PROMETHEUS_HOST}
            LOKI_HOST: ${LOKI_HOST}
            SUFFIX: ${SUFFIX}
        secrets:
            - gf_admin_password
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - monitoring
        depends_on:
            prometheusdev:
                condition: service_healthy
            lokidev:
                condition: service_healthy
            alloydev:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
            interval: 5s
            timeout: 3s
            retries: 30

    # Job de un solo uso: crea el segundo usuario de Grafana (rol Viewer) vía
    # API HTTP -Grafana no tiene env var nativa para un SEGUNDO usuario no-
    # admin-. Mismo patrón que mssql-initdev en corporate-infra: profile
    # "init" (no arranca con "docker compose up", se corre aparte con
    # "run --rm" desde corporate-scripts/monitoring.ps1, DESPUÉS de que
    # grafanadev esté healthy), reutilizando la MISMA imagen que grafanadev
    # (comparten Dockerfile, ver corporate-monitoring/Grafana/Dockerfile) con
    # un "entrypoint:" distinto -igual patrón que mssql01dev/mssql-initdev-.
    grafana-initdev:
        profiles: ["init"]
        build:
            context: ./Grafana
        container_name: ${GRAFANA_HOST}-init${SUFFIX}
        hostname: ${GRAFANA_HOST}-init${SUFFIX}
        restart: "no"
        entrypoint: ["/bin/sh", "/init/create-viewer-user.sh"]
        # Job de un solo uso: solo hace curl+jq contra la API de Grafana, sin
        # ninguna operación de root.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    memory: 128M
                    cpus: "0.25"
        environment:
            GRAFANA_URL: http://${GRAFANA_HOST}01${SUFFIX}:3000
            GF_ADMIN_USER: ${GF_ADMIN}${SUFFIX}
            GF_ADMIN_PASSWORD_FILE: /run/secrets/gf_admin_password
            GF_VIEWER_USER: ${GF_USER}${SUFFIX}
            GF_VIEWER_PASSWORD_FILE: /run/secrets/gf_user_password
            GF_VIEWER_EMAIL: ${GF_USER}${SUFFIX}@corpinfra.local
        secrets:
            - gf_admin_password
            - gf_user_password
        networks:
            - monitoring
        depends_on:
            grafanadev:
                condition: service_healthy
    # **************************    FIN Grafana **************************

    # *********************        Proxy único: NGINX (HTTP/L7) *********************
    # Único servicio con puerto publicado al host -mismo criterio de
    # seguridad que corporate-infra: nada más expone puertos directamente,
    # todo el tráfico entra por acá-.
    nginxmondev:
        build:
            context: ./NGINX
        container_name: ${NGINX_HOST}mon${SUFFIX}
        hostname: ${NGINX_HOST}mon${SUFFIX}
        restart: ${RESTART_POLICY}
        deploy:
            resources:
                limits:
                    cpus: "0.3"
                    memory: 128M
        environment:
            GRAFANA_HOST: ${GRAFANA_HOST}
            SUFFIX: ${SUFFIX}
            MONITORING_SSL_PORT: ${MONITORING_SSL_PORT}
        volumes:
            # Development hardcodeado a proposito, mismo criterio que
            # corporate-api/compose.dev.yml: este archivo es dev-only (no
            # existe compose.test.yml/compose.prod.yml todavia).
            - ../corporate-secrets/${SECRETS_ENV}/certs/monitoring:/etc/nginx/certs:ro
        # Bindeado a ALLOCATED_IP, no a 0.0.0.0 -mismo criterio que
        # corporate-infra/corporate-api. Puerto 3333 (interno) solo hace el
        # 301 a HTTPS (3334 interno) -mismo patron que corporate-api/nginx.
        ports:
            - "${ALLOCATED_IP}:${MONITORING_PROXY_PORT}:3333"
            - "${ALLOCATED_IP}:${MONITORING_SSL_PORT}:3334"
        # Dual-homed: "monitoring" (internal, para reenviar a Grafana) +
        # "public" (NO internal, exclusiva de este servicio, solo para que
        # Docker publique estos 2 puertos al host -en este host, "internal:
        # true" bloquea el port-publish por completo, confirmado en la
        # práctica, ver el comentario en "monitoring" más arriba-). Ni
        # Grafana ni Loki/Alloy/Prometheus/dockerproxyfilterdev se conectan
        # acá: solo nginxmondev.
        networks:
            - monitoring
            - public
        depends_on:
            grafanadev:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        # Hallazgo de auditoría (MEDIO): mismo criterio que los otros dos
        # NGINX del repo.
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
    # **************************    FIN Proxy NGINX **************************
